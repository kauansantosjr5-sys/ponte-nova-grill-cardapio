<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel · Ponte Nova Grill</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#141010;--card:#1F1917;--card2:#2A2220;--line:#3A2F2B;--tx:#FBF3EA;--mut:#BFAFA4;--fire:#F26A1B;--gold:#F2B33D;--ok:#1FA855;--blue:#3B82F6;--red:#E5484D}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:rgba(20,16,16,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px;height:64px}
header img{height:38px;background:#fff;border-radius:8px;padding:3px 8px}
header h1{font-size:16px;font-weight:700}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{padding:8px 16px;border-radius:99px;background:var(--card2);color:var(--mut);font-weight:600}
.tabs button.on{background:var(--fire);color:#fff}
.tabs .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:#fff;color:var(--fire);font-size:12px;font-weight:800}
.out{color:var(--mut);font-size:13px;padding:8px}
/* login */
.login{max-width:360px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:12px}
.login img{height:56px;align-self:center;background:#fff;border-radius:10px;padding:4px 10px}
.login h2{text-align:center;font-size:18px}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--fire)}
.btn{background:var(--fire);color:#fff;font-weight:700;border-radius:10px;padding:11px 16px}
.btn.sec{background:var(--card2);color:var(--tx)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.err{color:#ff8a80;font-size:13px;min-height:18px;text-align:center}
/* pedidos */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 14px}
.bar .f button{padding:7px 14px;border-radius:99px;background:var(--card2);color:var(--mut);font-weight:600;font-size:13px}
.bar .f button.on{background:var(--tx);color:var(--bg)}
.bar .f{display:flex;gap:6px;flex-wrap:wrap}
.bar .r{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.live{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(31,168,85,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(31,168,85,0)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding-bottom:40px}
.od{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.od.novo{border-color:var(--fire);box-shadow:0 0 0 1px var(--fire) inset}
.od .h{display:flex;align-items:center;gap:10px}
.od .m{font-size:22px;font-weight:800}
.od .t{color:var(--mut);font-size:12px}
.st{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.st.novo{background:var(--fire);color:#fff}.st.preparando{background:var(--gold);color:#241a10}.st.entregue{background:var(--ok);color:#fff}.st.cancelado{background:#555;color:#ddd}
.od ul{list-style:none;display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.od li{display:flex;gap:8px;font-size:14px}
.od li b{min-width:28px}
.od li span{flex:1;min-width:0}
.od li small{display:block;color:var(--gold);font-size:12px}
.od .tot{display:flex;justify-content:space-between;font-weight:800;border-top:1px solid var(--line);padding-top:8px}
.od .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--mut);text-align:center;padding:60px 0;grid-column:1/-1}
/* cardápio */
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.cat>.ch{display:flex;gap:8px;align-items:center;padding:12px 14px;background:var(--card2)}
.cat>.ch input{font-weight:700;font-size:16px;background:transparent;border-color:transparent;padding:6px 8px}
.cat>.ch input:focus{border-color:var(--fire);background:var(--bg)}
.row{display:grid;grid-template-columns:72px minmax(0,1fr) 110px auto;gap:10px;align-items:start;padding:12px 14px;border-top:1px solid var(--line)}
.row.off{opacity:.5}
.ph{width:72px;height:72px;border-radius:12px;background:#fff center/cover no-repeat;position:relative;overflow:hidden}
.ph label{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;text-align:center;padding:3px 0;cursor:pointer}
.ph input{display:none}
.fl{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl textarea{min-height:52px;resize:vertical;font-size:13px}
.pr input{text-align:right}
.ra{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap}
.sw input{width:auto;accent-color:var(--ok)}
.ic{color:var(--mut);font-size:12px;padding:4px 6px;border-radius:6px}
.ic:hover{background:var(--card2);color:var(--tx)}
.savebar{position:sticky;bottom:0;background:rgba(20,16,16,.96);border-top:1px solid var(--line);padding:12px 0;margin-top:10px}
.savebar .wrap{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.savebar .msg{margin-right:auto;color:var(--mut);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){
 header .wrap{height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
 .tabs{margin-left:0;width:100%}
 .row{grid-template-columns:64px minmax(0,1fr)}
 .row .pr,.row .ra{grid-column:2}
 .ra{flex-direction:row;align-items:center;flex-wrap:wrap}
 .ph{width:64px;height:64px}
}
/* comanda */
#print{display:none}
@media print{
 @page{size:80mm auto;margin:3mm}
 body{background:#fff;color:#000}
 body>*:not(#print){display:none!important}
 #print{display:block;font:13px/1.35 'Courier New',monospace;color:#000;width:72mm}
 #print h2{font-size:16px;text-align:center}
 #print .m{font-size:26px;font-weight:900;text-align:center;margin:4px 0}
 #print hr{border:0;border-top:1px dashed #000;margin:6px 0}
 #print .l{display:flex;justify-content:space-between;gap:6px}
 #print .o{font-size:12px;padding-left:22px}
}
</style>
</head>
<body>
<div id="app">
 <section id="loginV" class="login" hidden>
  <img src="logo.png" alt="Ponte Nova Grill">
  <h2>Painel do restaurante</h2>
  <input id="em" type="text" placeholder="Usuário" autocomplete="username" autocapitalize="none" spellcheck="false">
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
  <button class="btn" id="loginB">Entrar</button>
  <div class="err" id="lerr"></div>
 </section>

 <div id="mainV" hidden>
  <header><div class="wrap">
   <img src="logo.png" alt=""><h1>Painel</h1>
   <nav class="tabs"><button data-t="ped" class="on">Pedidos<span class="badge" id="nb" hidden>0</span></button><button data-t="car">Cardápio</button></nav>
   <button class="out" id="outB">Sair</button>
  </div></header>

  <main class="wrap" id="pedV">
   <div class="bar">
    <div class="f" id="flt"><button data-f="ativos" class="on">Em aberto</button><button data-f="novo">Novos</button><button data-f="preparando">Preparando</button><button data-f="entregue">Entregues</button><button data-f="todos">Todos de hoje</button></div>
    <div class="r"><span class="live"></span><span id="upd">ao vivo</span><button class="btn sec sm" id="sndB">🔔 Ativar som</button></div>
   </div>
   <div class="grid" id="list"></div>
  </main>

  <main class="wrap" id="carV" hidden>
   <div class="bar"><div style="color:var(--mut);font-size:13px">Mude nome, descrição, preço e foto. Desmarque "Disponível" pra esconder um item que acabou. Depois toque em <b>Salvar cardápio</b>.</div></div>
   <div id="cats"></div>
   <button class="btn sec" id="addCat" style="margin:6px 0 20px">+ Nova categoria</button>
   <div class="savebar"><div class="wrap"><span class="msg" id="smsg">Nenhuma alteração</span><button class="btn ok" id="saveB" disabled>Salvar cardápio</button></div></div>
  </main>
 </div>
</div>
<div id="print"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="menu.js"></script>
<script>
const C=window.PN_CONFIG||{};
const $=s=>document.querySelector(s);
const brl=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const imgSrc=v=>!v?'':/^https?:/.test(v)?v:v+'.jpg';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
if(!C.supabaseUrl||!window.supabase){document.body.innerHTML='<div class="login"><h2>Painel ainda não configurado</h2><p style="color:#BFAFA4;text-align:center">Preencha supabaseUrl e supabaseKey no arquivo config.js.</p></div>';throw new Error('sem config')}
const SB=window.supabase.createClient(C.supabaseUrl,C.supabaseKey);

/* ===== LOGIN ===== */
const toEmail=u=>{u=u.trim().toLowerCase();return u.includes('@')?u:u.replace(/[^a-z0-9._-]/g,'')+'@pontenova.app'};
async function boot(){
  const {data:{session}}=await SB.auth.getSession();
  if(session){showMain()}else{$('#loginV').hidden=false}
}
$('#loginB').onclick=async()=>{
  const b=$('#loginB');b.disabled=true;$('#lerr').textContent='';
  const {error}=await SB.auth.signInWithPassword({email:toEmail($('#em').value),password:$('#pw').value});
  b.disabled=false;
  if(error){$('#lerr').textContent='Usuário ou senha incorretos';return}
  $('#loginV').hidden=true;showMain();
};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#loginB').click()};
$('#outB').onclick=async()=>{await SB.auth.signOut();location.reload()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('#pedV').hidden=b.dataset.t!=='ped';$('#carV').hidden=b.dataset.t!=='car';
  if(b.dataset.t==='car'&&!menuLoaded)loadMenu();
});
function showMain(){$('#mainV').hidden=false;loadOrders();startLive()}

/* ===== PEDIDOS ===== */
let orders=[],filt='ativos',seen=new Set(),firstLoad=true,sound=false,actx;
$('#sndB').onclick=()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();sound=true;$('#sndB').textContent='🔔 Som ligado';beep()}catch(e){}};
function beep(){if(!sound||!actx)return;const t=actx.currentTime;[0,.22].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.4,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.18);o.start(t+d);o.stop(t+d+.2)})}
function startOfDay(){const d=new Date();d.setHours(0,0,0,0);return d.toISOString()}
async function loadOrders(){
  const {data,error}=await SB.from('pedidos').select('*').gte('created_at',startOfDay()).order('created_at',{ascending:false}).limit(300);
  if(error){$('#upd').textContent='sem conexão';return}
  const novos=data.filter(o=>o.status==='novo'&&!seen.has(o.id));
  if(!firstLoad&&novos.length){beep();toast(novos.length>1?`${novos.length} pedidos novos!`:`Pedido novo – Mesa ${novos[0].mesa}`)}
  data.forEach(o=>seen.add(o.id));firstLoad=false;
  orders=data;drawOrders();
  $('#upd').textContent='atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function startLive(){
  SB.channel('pedidos').on('postgres_changes',{event:'*',schema:'public',table:'pedidos'},()=>loadOrders()).subscribe();
  setInterval(loadOrders,15000);
}
$('#flt').onclick=e=>{const b=e.target.closest('button');if(!b)return;filt=b.dataset.f;document.querySelectorAll('#flt button').forEach(x=>x.classList.toggle('on',x===b));drawOrders()};
const NEXT={novo:['preparando','Preparar'],preparando:['entregue','Entregue']};
function drawOrders(){
  const n=orders.filter(o=>o.status==='novo').length;$('#nb').hidden=!n;$('#nb').textContent=n;
  document.title=(n?`(${n}) `:'')+'Painel · Ponte Nova Grill';
  const list=orders.filter(o=>filt==='todos'?true:filt==='ativos'?['novo','preparando'].includes(o.status):o.status===filt);
  $('#list').innerHTML=list.length?list.map(o=>{
    const hr=new Date(o.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const nx=NEXT[o.status];
    return `<article class="od ${o.status}">
     <div class="h"><div><div class="m">Mesa ${esc(o.mesa)}</div><div class="t">#${o.id} · ${hr}${o.nome?' · '+esc(o.nome):''}</div></div><span class="st ${o.status}">${o.status}</span></div>
     <ul>${(o.itens||[]).map(i=>`<li><b>${i.q}x</b><span>${esc(i.n)}${i.obs?`<small>Obs: ${esc(i.obs)}</small>`:''}</span><em style="font-style:normal">${brl(i.p*i.q)}</em></li>`).join('')}</ul>
     <div class="tot"><span>Total</span><span>${brl(o.total)}</span></div>
     <div class="acts">${nx?`<button class="btn sm ${nx[0]==='entregue'?'ok':''}" data-s="${o.id}:${nx[0]}">${nx[1]}</button>`:''}<button class="btn sec sm" data-p="${o.id}">🖨 Imprimir</button>${o.status!=='cancelado'&&o.status!=='entregue'?`<button class="btn sec sm" data-s="${o.id}:cancelado">Cancelar</button>`:''}</div>
    </article>`}).join(''):'<div class="empty">Nenhum pedido aqui ainda.</div>';
}
$('#list').onclick=async e=>{
  const s=e.target.closest('[data-s]'),p=e.target.closest('[data-p]');
  if(s){const [id,st]=s.dataset.s.split(':');if(st==='cancelado'&&!s.dataset.ok){s.dataset.ok=1;s.textContent='Confirmar cancelar?';return}
    s.disabled=true;const {error}=await SB.from('pedidos').update({status:st}).eq('id',+id);if(error)toast('Erro ao atualizar');
    if(st==='preparando'){printOrder(orders.find(o=>o.id===+id))}
    loadOrders()}
  if(p)printOrder(orders.find(o=>o.id===+p.dataset.p));
};
function printOrder(o){
  if(!o)return;
  const hr=new Date(o.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  $('#print').innerHTML=`<h2>PONTE NOVA GRILL</h2><div class="m">MESA ${esc(o.mesa)}</div><div style="text-align:center">Pedido #${o.id} · ${hr}${o.nome?'<br>'+esc(o.nome):''}</div><hr>
   ${(o.itens||[]).map(i=>`<div class="l"><span>${i.q}x ${esc(i.n)}</span><span>${brl(i.p*i.q)}</span></div>${i.obs?`<div class="o">* ${esc(i.obs)}</div>`:''}`).join('')}
   <hr><div class="l" style="font-weight:900"><span>TOTAL</span><span>${brl(o.total)}</span></div><hr>`;
  setTimeout(()=>window.print(),50);
}

/* ===== CARDÁPIO ===== */
let MENU=[],menuLoaded=false,dirty=false;
async function loadMenu(){
  const {data}=await SB.from('cardapio').select('menu').eq('id',1).maybeSingle();
  MENU=JSON.parse(JSON.stringify((data&&Array.isArray(data.menu)&&data.menu.length)?data.menu:window.DEFAULT_MENU||[]));
  menuLoaded=true;drawMenu();
}
function setDirty(v=true){dirty=v;$('#saveB').disabled=!v;$('#smsg').textContent=v?'Alterações não salvas':'Nenhuma alteração'}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
const pz=it=>(it.pizza||[]).map(o=>`${o[0]} = ${String(o[1]).replace('.',',')}`).join('\n');
function drawMenu(){
  $('#cats').innerHTML=MENU.map((c,ci)=>`<div class="cat">
   <div class="ch"><input value="${esc(c.cat)}" data-cat="${ci}"><button class="ic" data-up="${ci}" title="Subir">↑</button><button class="ic" data-dc="${ci}">Apagar categoria</button></div>
   ${c.items.map((it,ii)=>`<div class="row ${it.off?'off':''}">
     <div class="ph" style="background-image:url('${imgSrc(it.img)}')"><label>Trocar<input type="file" accept="image/*" data-img="${ci}.${ii}"></label></div>
     <div class="fl"><input value="${esc(it.n)}" data-f="${ci}.${ii}.n" placeholder="Nome"><textarea data-f="${ci}.${ii}.d" placeholder="Descrição">${esc(it.d)}</textarea>
      ${it.pizza?`<textarea data-pz="${ci}.${ii}" placeholder="Tamanho = preço (um por linha)">${esc(pz(it))}</textarea>`:''}</div>
     <div class="pr">${it.pizza?'<div style="color:var(--mut);font-size:12px;text-align:right">preços por tamanho</div>':`<input inputmode="decimal" value="${it.p!=null&&it.p!==''?Number(it.p).toFixed(2).replace('.',','):''}" data-f="${ci}.${ii}.p" placeholder="Preço">`}</div>
     <div class="ra"><label class="sw"><input type="checkbox" ${it.off?'':'checked'} data-on="${ci}.${ii}">Disponível</label><button class="ic" data-di="${ci}.${ii}">Apagar</button></div>
   </div>`).join('')}
   <div style="padding:10px 14px;border-top:1px solid var(--line)"><button class="btn sec sm" data-ai="${ci}">+ Item nesta categoria</button></div>
  </div>`).join('');
}
const at=k=>{const [c,i]=k.split('.').map(Number);return MENU[c].items[i]};
$('#cats').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.cat!==undefined){MENU[+t.dataset.cat].cat=t.value;setDirty()}
  if(t.dataset.f){const [c,i,f]=t.dataset.f.split('.');const it=MENU[+c].items[+i];
    if(f==='p'){const v=parseFloat(t.value.replace(/\./g,'').replace(',','.'));it.p=isNaN(v)?0:v}else it[f]=t.value;setDirty()}
  if(t.dataset.pz){const it=at(t.dataset.pz);it.pizza=t.value.split('\n').map(l=>l.split('=')).filter(a=>a.length===2&&a[0].trim()).map(a=>[a[0].trim(),parseFloat(a[1].trim().replace(',','.'))||0]);it.from=Math.min(...it.pizza.map(x=>x[1]));setDirty()}
});
$('#cats').addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.on){at(t.dataset.on).off=!t.checked;t.closest('.row').classList.toggle('off',!t.checked);setDirty()}
  if(t.dataset.img&&t.files[0]){
    const it=at(t.dataset.img),ph=t.closest('.ph');ph.style.opacity=.5;
    try{const blob=await shrink(t.files[0]);const path=`itens/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
      const {error}=await SB.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;
      it.img=SB.storage.from('fotos').getPublicUrl(path).data.publicUrl;ph.style.backgroundImage=`url('${it.img}')`;setDirty();toast('Foto enviada ✓')}
    catch(err){console.error(err);toast('Erro ao enviar a foto')}
    ph.style.opacity=1;
  }
});
$('#cats').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ai){const c=MENU[+b.dataset.ai];c.items.push({id:'i'+Date.now().toString(36),n:'Novo item',d:'',p:0,img:''});setDirty();drawMenu()}
  if(b.dataset.di){if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Confirmar?';return}const [c,i]=b.dataset.di.split('.').map(Number);MENU[c].items.splice(i,1);setDirty();drawMenu()}
  if(b.dataset.dc){if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Confirmar? Apaga os itens';return}MENU.splice(+b.dataset.dc,1);setDirty();drawMenu()}
  if(b.dataset.up){const i=+b.dataset.up;if(i>0){[MENU[i-1],MENU[i]]=[MENU[i],MENU[i-1]];setDirty();drawMenu()}}
});
$('#addCat').onclick=()=>{MENU.push({cat:'Nova categoria',items:[{id:'i'+Date.now().toString(36),n:'Novo item',d:'',p:0,img:''}]});setDirty();drawMenu();window.scrollTo(0,document.body.scrollHeight)};
$('#saveB').onclick=async()=>{
  const b=$('#saveB');b.disabled=true;b.textContent='Salvando...';
  const {error}=await SB.from('cardapio').upsert({id:1,menu:MENU,updated_at:new Date().toISOString()});
  b.textContent='Salvar cardápio';
  if(error){b.disabled=false;toast('Erro ao salvar');console.error(error);return}
  setDirty(false);toast('Cardápio salvo! Já está no site ✓');
};
function shrink(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',.85);URL.revokeObjectURL(im.src)};im.onerror=rej;im.src=URL.createObjectURL(file)})}

boot();
</script>
</body>
